# ViNumFCR raw-import configuration.
# Put official source files at data/raw/vinumfcr/{train,dev,test}.jsonl first.
# The importer accepts these aliases because the official release's column names
# must be verified against the downloaded files before a processed release.
dataset: vinumfcr
source_splits: [train, dev, test]
canonical_splits:
  train: train
  dev: validation
  test: test
columns:
  claim: [claim, Claim, statement, Statement]
  context: [paragraph, Paragraph, premise, Premise, context, Context]
  evidence: [evidence, Evidence, gold_evidence, GoldEvidence]
  label: [label, Label, labels]
  topic: [topic, Topic, category, Category]
  id: [id, ID, annotation_id, index]
