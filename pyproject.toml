[project]
name = "factcheck-vietnamese"
version = "0.1.0"
description = "Vietnamese evidence-based fact-checking research system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=3,<4",
    "pandas>=2.2,<3",
    "pyarrow>=17,<23",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "bm25s>=0.2,<1",
    "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
baseline = [
    "accelerate>=1,<2",
    "evaluate>=0.4,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
