[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vifactcheck-reproduction"
version = "0.1.0"
description = "Article-conditioned Vietnamese fact verification with BM25 and PhoBERT"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=4.46,<6", "huggingface-hub>=0.24", "pyarrow>=15", "numpy>=1.24", "rank-bm25==0.2.2", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vifactcheck = "vifactcheck.cli:main"

[tool.setuptools.packages.find]
include = ["vifactcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
